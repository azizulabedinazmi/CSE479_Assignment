<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4338ca"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="type"><rect x="68" y="90" width="0" height="30"><animate attributeName="width" values="0;110;110;0" keyTimes="0;.4;.9;1" dur="4s" begin="-2s" repeatCount="indefinite"/></rect></clipPath>
    <style>.blob{animation:m 9s ease-in-out infinite alternate}@keyframes m{to{transform:translate(-80px,40px)}}
      .cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}</style>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <g filter="url(#blur)"><circle class="blob" cx="900" cy="80" r="110" fill="#22d3ee" opacity=".6"/><circle cx="1080" cy="260" r="90" fill="#f472b6" opacity=".7"/></g>
  <!-- glass login card -->
  <g transform="translate(780 30)">
    <rect width="320" height="260" rx="22" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>
    <circle cx="160" cy="46" r="22" fill="#fff" fill-opacity=".9"/><circle cx="160" cy="40" r="8" fill="#7c3aed"/><path d="M146 58a14 10 0 0 1 28 0z" fill="#7c3aed"/>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
      <rect x="30" y="86" width="260" height="38" rx="10" fill="#fff" fill-opacity=".85"/>
      <text x="44" y="111" fill="#4c1d95">✉</text><text x="70" y="111" fill="#4c1d95" clip-path="url(#type)">you@ewu.edu</text><text class="cur" x="182" y="111" fill="#4c1d95">|</text>
      <rect x="30" y="136" width="260" height="38" rx="10" fill="#fff" fill-opacity=".85"/>
      <text x="44" y="161" fill="#4c1d95">🔒  ••••••••</text>
      <rect x="30" y="192" width="260" height="40" rx="10" fill="#111827"/>
      <text x="160" y="218" text-anchor="middle" fill="#fff" font-weight="700">Log in</text>
    </g>
  </g>
  <text x="62" y="90" font-family="Consolas, Menlo, monospace" font-size="17" fill="#e9d5ff" letter-spacing="3">CSE479 · WEB PROGRAMMING</text>
  <text x="58" y="168" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#fff">Login &amp; Register</text>
  <text x="62" y="214" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#f5d0fe">PHP + MySQL user accounts assignment</text>
  <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff">
    <rect x="62" y="240" width="118" height="30" rx="15" fill="#fff" fill-opacity=".18"/><text x="121" y="260" text-anchor="middle">register.php</text>
    <rect x="190" y="240" width="100" height="30" rx="15" fill="#fff" fill-opacity=".18"/><text x="240" y="260" text-anchor="middle">login.php</text>
    <rect x="300" y="240" width="140" height="30" rx="15" fill="#fff" fill-opacity=".18"/><text x="370" y="260" text-anchor="middle">assignment_db</text>
  </g>
</svg>
